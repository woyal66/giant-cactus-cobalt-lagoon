# Publishes the website to GitHub Pages: the privacy policy and terms (site/, for the Google Play
# listing), the GBR 30 m depth tiles the app reads (depth/{z}/{x}/{y}.png) and the EOT20 global
# tide files (tides/eot20/{i}_{j}.png, 46 MB, from DGFI-TUM's EOT20, CC BY 4.0) and worldwide
# shelf depth from GEBCO_2026 (depth-world/{z}/{x}/{y}.png, public domain, zoom 3–8), and the web
# version of the app (app/, the same code as the phone app, for planning on a laptop or tablet).
# One-time setup: Settings → Pages → Source: "GitHub Actions". Then run this workflow (or push a
# change to site/ or the tile script). The address is shown in the run, e.g.
# https://<user>.github.io/<repo>/privacy.html
#
# The depth tiles are built from Geoscience Australia's "Great Barrier Reef bathymetry 2020 30 m"
# (CC BY 4.0) by scripts/build-depth-tiles.py: a 3.8 GB download and about half an hour the
# first time, then kept in the Actions cache until the script changes.
name: Publish website and depth tiles

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["site/**", "src/**", "public/**", "mobile.html", "vite.mobile.config.ts", "package-lock.json", "scripts/build-depth-tiles.py", "scripts/build-tide-chunks.py", ".github/workflows/legal-pages.yml"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Build everything and upload it. Kept separate from publishing so the tile caches are saved
  # even if GitHub's publish step has a hiccup, and only "deploy" needs re-running then.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Depth tiles from cache
        id: tiles
        uses: actions/cache@v4
        with:
          path: out/depth
          key: depth-tiles-${{ hashFiles('scripts/build-depth-tiles.py') }}

      - name: Build depth tiles
        if: steps.tiles.outputs.cache-hit != 'true'
        run: |
          pip install rasterio numpy pillow
          curl -sSL -o gbr30.zip "https://files.ausseabed.gov.au/survey/Great%20Barrier%20Reef%20Bathymetry%202020%2030m.zip"
          unzip -q gbr30.zip -d gbr30 && rm gbr30.zip
          python3 scripts/build-depth-tiles.py gbr30 out/depth
          rm -rf gbr30

      - name: Worldwide depth tiles from cache
        id: world
        uses: actions/cache@v4
        with:
          path: out/depth-world
          key: depth-world-${{ hashFiles('scripts/build-depth-tiles.py') }}

      - name: Build worldwide depth tiles (GEBCO_2026, public domain)
        if: steps.world.outputs.cache-hit != 'true'
        run: |
          pip install rasterio numpy pillow
          curl -sSL --retry 8 --retry-delay 15 --retry-all-errors -C - -o gebco.zip "https://dap.ceda.ac.uk/bodc/gebco/global/gebco_2026/ice_surface_elevation/geotiff/gebco_2026_geotiff.zip"
          unzip -q gebco.zip -d gebco && rm gebco.zip
          python3 scripts/build-depth-tiles.py gebco out/depth-world --zmin 3 --zmax 8 --land-cap 5 --steps 20:0.25,100:1,inf:2 --source "GEBCO_2026 Grid (GEBCO Compilation Group 2026), public domain"
          rm -rf gebco

      - name: Tide files from cache
        id: tides
        uses: actions/cache@v4
        with:
          path: out/tides
          key: tide-chunks-${{ hashFiles('scripts/build-tide-chunks.py') }}

      - name: Build tide files
        if: steps.tides.outputs.cache-hit != 'true'
        run: |
          pip install netCDF4 numpy pillow
          curl -sSL -o eot20.zip "https://www.seanoe.org/data/00683/79489/data/85762.zip"
          unzip -q eot20.zip ocean_tides.zip && rm eot20.zip
          unzip -q ocean_tides.zip -d eot20 && rm ocean_tides.zip
          python3 scripts/build-tide-chunks.py eot20/ocean_tides out/tides/eot20
          rm -rf eot20

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Build the web app (same code as the phone app)
        env:
          VITE_LICENSED_IMAGERY_ONLY: "1"
          VITE_MAPTILER_KEY: ${{ secrets.VITE_MAPTILER_KEY || vars.VITE_MAPTILER_KEY }}
          VITE_ESRI_KEY: ${{ secrets.VITE_ESRI_KEY || vars.VITE_ESRI_KEY }}
          # Online-only licensed imagery (docs/imagery-keys.md); each is off when unset.
          VITE_GOOGLE_TILES_KEY: ${{ secrets.VITE_GOOGLE_TILES_KEY || vars.VITE_GOOGLE_TILES_KEY }}
          VITE_AZURE_MAPS_KEY: ${{ secrets.VITE_AZURE_MAPS_KEY || vars.VITE_AZURE_MAPS_KEY }}
          VITE_MAPBOX_TOKEN: ${{ secrets.VITE_MAPBOX_TOKEN || vars.VITE_MAPBOX_TOKEN }}
          VITE_HERE_KEY: ${{ secrets.VITE_HERE_KEY || vars.VITE_HERE_KEY }}
          VITE_LINZ_KEY: ${{ secrets.VITE_LINZ_KEY || vars.VITE_LINZ_KEY }}
          # Online track library (docs/track-library.md); off when unset.
          VITE_TRACK_LIBRARY_URL: ${{ vars.VITE_TRACK_LIBRARY_URL }}
          VITE_TRACK_LIBRARY_KEY: ${{ vars.VITE_TRACK_LIBRARY_KEY }}
          # Data on this same site, relative to /app/.
          VITE_DEPTH_TILES: ../depth/{z}/{x}/{y}.png
          VITE_DEPTH_GLOBAL_TILES: ../depth-world/{z}/{x}/{y}.png
          VITE_TIDE_MODEL: ../tides/eot20/
        run: |
          npm ci
          npx vite build --config vite.mobile.config.ts --outDir out/app
          cp out/app/mobile.html out/app/index.html

      - name: Assemble site
        run: |
          mkdir -p public_site
          cp -r site/. public_site/
          cp -r out/depth public_site/depth
          cp -r out/depth-world public_site/depth-world
          cp -r out/tides public_site/tides
          cp -r out/app public_site/app
          du -sh public_site

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
